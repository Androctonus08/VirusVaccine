name: Stage verified release assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows verification run ID
        required: true
      commit:
        description: Full commit SHA built by that run
        required: true
      tag:
        description: Existing draft release tag
        required: true

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_RUN: ${{ inputs.run_id }}
      VERIFIED_COMMIT: ${{ inputs.commit }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate verification run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERIFIED_RUN -notmatch '^\d+$' -or $env:VERIFIED_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release inputs' }
          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:VERIFIED_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:VERIFIED_COMMIT -or $run.path -ne '.github/workflows/verify.yml' -or $run.head_branch -ne 'main') { throw 'A successful matching Windows verification run is required' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Download verified build and stage draft assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          $release = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG -and $_.draft })
          if ($LASTEXITCODE -or $release.Count -ne 1) { throw 'Exactly one existing draft release is required' }
          $artifactDir = Join-Path $PWD 'release-artifacts'
          gh run download $env:VERIFIED_RUN --repo $env:GH_REPO --name VirusVaccine-Windows-preview --dir $artifactDir
          if ($LASTEXITCODE) { throw 'Artifact download failed' }
          $exe = Join-Path $artifactDir "VirusVaccine-$version-win-x64.exe"
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Expected executable missing' }
          $checksums = Join-Path $artifactDir 'SHA256SUMS.txt'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($exe))" | Set-Content -LiteralPath $checksums -Encoding ascii
          foreach ($asset in $release[0].assets) {
            if ($asset.name -in @([IO.Path]::GetFileName($exe),'SHA256SUMS.txt')) {
              if ($asset.state -eq 'uploaded') { throw 'A completed asset already exists; review it before replacing' }
              gh api --method DELETE "repos/$env:GH_REPO/releases/assets/$($asset.id)"
              if ($LASTEXITCODE) { throw 'Incomplete draft asset cleanup failed' }
            }
          }
          gh release upload $env:RELEASE_TAG $exe $checksums --repo $env:GH_REPO
          if ($LASTEXITCODE) { throw 'Draft upload failed' }
          Write-Output 'Verified build and checksum staged. Release remains draft for review.'
