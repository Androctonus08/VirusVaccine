name: Windows verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-public.cjs
      - run: npm test
        timeout-minutes: 2
      - run: npm run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VirusVaccine-Windows-preview
          path: dist/VirusVaccine-*-win-x64.exe
          if-no-files-found: error

# Real ClamAV and native UI reviews are manual local checks. CI does not
# download definition databases or interact with existing security software.
